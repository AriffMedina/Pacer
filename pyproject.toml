[project]
name = "pacer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "boto3>=1.43.72",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langfuse>=4.14.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    # Windows no trae base de zonas horarias del sistema: sin esto `zoneinfo`
    # falla hasta con "UTC" y el reloj del corredor no funciona al desarrollar.
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.52.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "hypothesis>=6.165.9",
    "import-linter>=2.13",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
