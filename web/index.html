<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C100F">
<title>Pacer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens de UI.md §3. El lima es escaso a propósito: marca lo vivo, no decora. */
:root{
  --superficie:#141917; --superficie-alta:#1C2220;
  --linea:rgba(255,255,255,.08);
  --texto:#F0F3EC; --texto-2:#99A19A; --texto-3:#5C645E;
  --lima:#C6F94A; --lima-tenue:rgba(198,249,74,.12); --sobre-lima:#0E1211;
  --acento-legible:var(--lima);
  --curva:cubic-bezier(.22,.61,.36,1);
}
/* Claro no es el oscuro invertido: es otra composición (§3). */
@media (prefers-color-scheme: light){
  :root{
    --superficie:#FFFFFF; --superficie-alta:#FFFFFF;
    --linea:rgba(14,18,17,.09);
    --texto:#0E1211; --texto-2:#5C645E; --texto-3:#8A918B;
    --lima-tenue:rgba(74,107,18,.10);
    /* Lima sobre blanco da ~1.4:1. Para texto e iconos se usa oliva (§3.3). */
    --acento-legible:#4A6B12;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Sora,system-ui,sans-serif;color:var(--texto);
  display:flex;align-items:center;justify-content:center;
  /* El fondo es luz con caída, no un gradiente de dos paradas (§5). El segundo
     foco descentrado es lo que evita que se vea generado. */
  background:
    radial-gradient(140% 62% at 50% -14%,#16302A 0%,transparent 58%),
    radial-gradient(100% 44% at 78% 8%,#10201D 0%,transparent 62%),
    linear-gradient(180deg,#0C100F 0%,#090C0B 54%,#080A0A 100%);
  background-attachment:fixed;
}
@media (prefers-color-scheme: light){
  body{background:
    radial-gradient(140% 60% at 50% -16%,#FFFFFF 0%,transparent 60%),
    linear-gradient(180deg,#F2F3EE 0%,#E7E9E2 100%);}
}

/* En escritorio la app vive dentro de una columna con su propia caída de luz:
   estirada a 1900px se ve como una web vacía, no como un instrumento. */
.marco{
  width:100%;max-width:440px;height:100dvh;max-height:940px;
  position:relative;display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:600px){
  .marco{border:1px solid var(--linea);border-radius:34px;height:min(92dvh,880px);
    box-shadow:0 40px 120px rgba(0,0,0,.5);
    background:radial-gradient(120% 50% at 50% -8%,rgba(22,48,42,.55) 0%,transparent 60%);}
}

.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--texto-3)}
.display{font-weight:200;font-size:clamp(30px,8.5vw,40px);letter-spacing:-.035em;line-height:1.08}
.titulo{font-weight:600;font-size:19px;letter-spacing:-.02em}

.vista{flex:1;overflow-y:auto;padding:26px 22px 0;display:none;flex-direction:column}
.vista.activa{display:flex;animation:entrar .24s var(--curva)}
@keyframes entrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vista::-webkit-scrollbar{width:0}

/* ---------- Orbe: el elemento firma (§7) ---------- */
.orbe-zona{display:grid;place-items:center;padding:22px 0 6px}
.orbe{
  width:min(168px,42vw);aspect-ratio:1;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 28%,#26302C 0%,#111614 55%,#080A0A 100%);
  box-shadow:0 0 70px rgba(198,249,74,.16),inset 0 0 40px rgba(0,0,0,.6);
  animation:respirar 4.2s var(--curva) infinite;
}
/* Luz de borde solo en el arco superior-izquierdo: una luna, no un blob. */
.orbe::before{
  content:'';position:absolute;inset:-1px;border-radius:50%;padding:1.5px;
  background:conic-gradient(from 190deg,rgba(198,249,74,.85) 0deg,rgba(198,249,74,.15) 70deg,transparent 130deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.orbe::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(198,249,74,.10) 0%,transparent 45%);
}
@keyframes respirar{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.orbe.pensando::before{animation:girar 2.4s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orbe,.orbe::before{animation:none!important}}

/* ---------- Transcripción que se desvanece (§8) ---------- */
.transcripcion{flex:1;min-height:96px;display:flex;flex-direction:column;
  justify-content:flex-end;gap:9px;padding-top:10px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 38%);
  mask-image:linear-gradient(180deg,transparent,#000 38%)}
.turno{line-height:1.38;transition:all .24s var(--curva)}
.turno.actual{font-size:21px;opacity:1;font-weight:300}
.turno.previo{font-size:17px;opacity:.32}
.turno.viejo{font-size:15px;opacity:.12}
.turno.mio{text-align:right;color:var(--texto-2)}
.turno.coach{text-align:center}
.estado{text-align:center;padding:14px 0 4px;min-height:26px}

.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding-bottom:6px}
.chip{background:var(--superficie);border:1px solid var(--linea);border-radius:999px;
  padding:9px 13px;font-size:13px;color:var(--texto-2);cursor:pointer;font-family:inherit;
  transition:transform .24s var(--curva),opacity .24s var(--curva)}
.chip:active{transform:scale(.96)}
.chip[disabled]{opacity:.4}

/* ---------- Controles: píldora de Train unseen, con el círculo a la derecha --- */
.controles{padding:12px 22px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
.hablar{flex:1;height:56px;border:0;border-radius:999px;background:var(--lima);
  color:var(--sobre-lima);font-family:'JetBrains Mono',monospace;font-weight:500;
  font-size:11px;letter-spacing:.14em;cursor:pointer;touch-action:none;
  display:flex;align-items:center;justify-content:center;gap:12px;position:relative;
  transition:transform .18s var(--curva)}
.hablar:active{transform:scale(.985)}
.hablar[disabled]{opacity:.45}
.hablar .punto{position:absolute;right:7px;width:42px;height:42px;border-radius:50%;
  background:rgba(14,18,17,.14);display:grid;place-items:center;font-size:15px}
.redondo{width:52px;height:52px;border-radius:50%;background:var(--superficie);
  border:1px solid var(--linea);color:var(--texto-2);font-size:16px;cursor:pointer;
  align-self:center;font-family:inherit}

/* ---------- Modo texto (referencia Aura, pantalla 6) ---------- */
.escritura{display:none;gap:8px;padding:12px 22px calc(16px + env(safe-area-inset-bottom))}
.escritura input{flex:1;height:52px;border-radius:999px;border:1px solid var(--linea);
  background:var(--superficie);color:var(--texto);padding:0 18px;font-family:inherit;
  font-size:15px;outline:none}
.escritura input:focus{border-color:rgba(198,249,74,.35)}
.escritura button{width:52px;height:52px;border-radius:50%;border:0;background:var(--lima);
  color:var(--sobre-lima);font-size:17px;cursor:pointer}

/* ---------- Tarjetas (§9): rampa ordinal, no arcoíris ---------- */
.tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:20px;
  padding:15px 16px;display:flex;gap:14px;align-items:center;margin-bottom:9px}
.tarjeta.hoy{background:var(--superficie-alta);border-color:rgba(198,249,74,.28);
  box-shadow:0 0 32px rgba(198,249,74,.07)}
.barra{width:3px;align-self:stretch;border-radius:2px;min-height:42px}
.barra.facil{background:rgba(255,255,255,.22)}
.barra.calidad{background:rgba(255,255,255,.55)}
.barra.largo{border:1px solid var(--lima);background:transparent}
@media (prefers-color-scheme: light){
  .barra.facil{background:rgba(14,18,17,.18)}
  .barra.calidad{background:rgba(14,18,17,.45)}
  .barra.largo{border-color:#4A6B12}
}
.tarjeta .cuerpo{flex:1;min-width:0}
.tarjeta .dia{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--texto-3)}
.tarjeta .tipo{font-weight:600;font-size:15px;margin-top:2px}
.tarjeta .km{font-family:'JetBrains Mono',monospace;font-size:20px;white-space:nowrap}
.hecha{font-size:10.5px;letter-spacing:.1em;color:var(--acento-legible)}

.progreso{display:flex;align-items:center;gap:12px;margin:16px 0 18px}
.riel{flex:1;height:1px;background:var(--linea);position:relative}
.riel span{position:absolute;left:0;top:0;background:var(--lima);height:1px}
.tag{display:inline-block;background:var(--lima-tenue);border:1px solid rgba(198,249,74,.3);
  border-radius:999px;padding:3px 9px;font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--acento-legible);vertical-align:middle}
.cuenta{font-family:'JetBrains Mono',monospace;font-size:72px;line-height:1;letter-spacing:-.04em}
.suave{color:var(--texto-2);line-height:1.6}

/* ---------- Navegación conectada (§10) ---------- */
nav{display:flex;background:var(--superficie);border-top:1px solid var(--linea)}
nav button{flex:1;background:none;border:0;color:var(--texto-3);cursor:pointer;
  padding:13px 0 calc(13px + env(safe-area-inset-bottom));
  display:grid;place-items:center;gap:5px;font-size:9.5px;letter-spacing:.14em;
  font-family:'JetBrains Mono',monospace;transition:color .24s var(--curva)}
nav button.activo{color:var(--acento-legible)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}

/* El diagnóstico NUNCA se abre solo. Vive detrás del botón y se cierra igual. */
.cajon{display:none;border-top:1px solid var(--linea);padding:14px 22px;
  max-height:34dvh;overflow-y:auto;background:rgba(0,0,0,.25)}
.cajon.abierto{display:block}
.cajon pre{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--texto-3);
  white-space:pre-wrap;line-height:1.65}
</style>
</head>
<body>
<div class="marco">

  <section class="vista activa" id="v-coach">
    <p class="eyebrow" id="cinta">PACER</p>
    <h1 class="display" id="saludo">Buenas</h1>

    <div class="orbe-zona"><div class="orbe" id="orbe"></div></div>
    <div class="transcripcion" id="transcripcion"></div>
    <p class="eyebrow estado" id="estado">LISTO</p>
    <div class="chips" id="chips"></div>
  </section>

  <section class="vista" id="v-plan">
    <p class="eyebrow" id="cinta-plan">TU PLAN</p>
    <h1 class="display">Tu plan <span class="tag" id="tag-version" hidden></span></h1>
    <div id="cuerpo-plan"></div>
  </section>

  <section class="vista" id="v-agenda">
    <p class="eyebrow">TU CARRERA OBJETIVO</p>
    <h1 class="display">Agenda</h1>
    <div id="cuerpo-agenda"></div>
  </section>

  <div class="controles" id="controles">
    <button class="redondo" id="btn-teclado" title="Escribir">⌨</button>
    <button class="hablar" id="hablar">MANTÉN PARA HABLAR<span class="punto">↑</span></button>
  </div>

  <form class="escritura" id="escritura">
    <button type="button" class="redondo" id="btn-voz" title="Volver a la voz">🎙</button>
    <input id="campo" placeholder="Escríbele al coach…" autocomplete="off">
    <button type="submit" aria-label="Enviar">↑</button>
  </form>

  <div class="cajon" id="cajon"><pre id="diagnostico"></pre></div>

  <nav>
    <button data-v="coach" class="activo">
      <svg viewBox="0 0 24 24"><path d="M3 12h3l2-6 4 12 3-9 2 3h4"/></svg>COACH</button>
    <button data-v="plan">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>PLAN</button>
    <button data-v="agenda">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>AGENDA</button>
    <button data-v="diag" id="nav-diag">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/></svg>DIAG</button>
  </nav>
</div>

<script>
const $ = (s) => document.querySelector(s);
const orbe = $('#orbe'), estado = $('#estado'), diag = $('#diagnostico');
const transcripcion = $('#transcripcion'), chips = $('#chips');
let turnos = [];

// Primer mensaje: lo que de verdad arranca un diagnóstico, no frases sueltas.
const INICIALES = ['Quiero correr un 21k', 'Soy nuevo corriendo', '¿Por dónde empiezo?'];
// Ya con plan, lo útil es reportar y consultar.
const CON_PLAN = ['¿Qué me toca hoy?', 'Ayer acabé muerto', 'Me duele la rodilla'];

const anotar = (l) => { diag.textContent += l + '\n'; };
const ponerEstado = (t) => { estado.textContent = t; };

/* Transcripción con desvanecido (§8): en voz no quieres un historial, quieres
   el turno actual con contexto suficiente. */
function decir(quien, texto){
  turnos = [...turnos, {quien, texto}].slice(-3);
  const clases = ['actual','previo','viejo'];
  transcripcion.innerHTML = '';
  turnos.forEach((t, i) => {
    const p = document.createElement('p');
    p.className = `turno ${clases[turnos.length-1-i]} ${t.quien==='mio'?'mio':'coach'}`;
    p.textContent = t.texto;
    transcripcion.appendChild(p);
  });
}

function pintarChips(lista){
  chips.innerHTML = lista.map(s => `<button class="chip">${s}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(b => { b.onclick = () => enviarTexto(b.textContent); });
}

(function saludar(){
  const h = new Date().getHours();
  $('#saludo').textContent = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  pintarChips(INICIALES);
})();

/* Un solo lugar decide qué barra inferior se ve: dos condiciones (¿estoy en
   coach? ¿estoy escribiendo?) con dos elementos se descoordinan solas. */
let vistaActual = 'coach', escribiendo = false;
function pintarBarra(){
  const enCoach = vistaActual === 'coach';
  $('#controles').style.display = enCoach && !escribiendo ? 'flex' : 'none';
  $('#escritura').style.display = enCoach && escribiendo ? 'flex' : 'none';
}

document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    if (b.dataset.v === 'diag'){ $('#cajon').classList.toggle('abierto'); b.classList.toggle('activo'); return; }
    document.querySelectorAll('nav button').forEach(x => { if (x.dataset.v !== 'diag') x.classList.remove('activo'); });
    b.classList.add('activo');
    document.querySelectorAll('.vista').forEach(s => s.classList.remove('activa'));
    $('#v-' + b.dataset.v).classList.add('activa');
    vistaActual = b.dataset.v;
    pintarBarra();
    if (vistaActual !== 'coach') cargarPlan();
  };
});

// Escribir es una alternativa a la voz, no una puerta de una sola dirección.
$('#btn-teclado').onclick = () => { escribiendo = true; pintarBarra(); $('#campo').focus(); };
$('#btn-voz').onclick = () => { escribiendo = false; pintarBarra(); };
$('#escritura').onsubmit = (e) => {
  e.preventDefault();
  const t = $('#campo').value.trim();
  if (t){ $('#campo').value = ''; enviarTexto(t); }
};

/* Un solo elemento de audio, desbloqueado durante el gesto del usuario: en
   móvil un play() que no nace de un toque queda a merced del autoplay. */
const reproductor = new Audio();
let desbloqueado = false;
function desbloquearAudio(){
  if (desbloqueado) return;
  desbloqueado = true;
  reproductor.muted = true;
  reproductor.play().catch(() => {});
  reproductor.pause();
  reproductor.muted = false;
}

/* El halo responde al micrófono REAL (§7). Un bucle fijo se nota de inmediato
   y mata la sensación de que el coach te está oyendo. */
let audioCtx, analizador, datos, animando;
function escucharVolumen(flujo){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    analizador = audioCtx.createAnalyser();
    analizador.fftSize = 256;
    audioCtx.createMediaStreamSource(flujo).connect(analizador);
    datos = new Uint8Array(analizador.frequencyBinCount);
    const pintar = () => {
      analizador.getByteFrequencyData(datos);
      const v = datos.reduce((a,b) => a+b, 0) / datos.length / 255;
      orbe.style.boxShadow = `0 0 ${70+v*140}px rgba(198,249,74,${.16+v*.5}),inset 0 0 40px rgba(0,0,0,.6)`;
      animando = requestAnimationFrame(pintar);
    };
    pintar();
  }catch(e){ /* sin analizador el orbe sigue respirando */ }
}
const dejarDeEscuchar = () => { cancelAnimationFrame(animando); orbe.style.boxShadow = ''; };

let grabadora = null, trozos = [];
const extension = (t) => t.includes('mp4') ? 'mp4' : t.includes('ogg') ? 'ogg' : 'webm';

function fallar(mensaje, detalle){
  ponerEstado(mensaje);
  anotar(detalle);           // al cajón, que el usuario abre si quiere
  setTimeout(() => ponerEstado('LISTO'), 4000);
}

async function empezar(){
  if (grabadora) return;
  desbloquearAudio();

  // navigator.mediaDevices solo existe en contexto seguro: HTTPS o localhost.
  // Aplica a TODOS los navegadores, no solo a Safari.
  if (!navigator.mediaDevices){
    fallar('SIN MICRÓFONO · USA EL TECLADO',
      'navigator.mediaDevices no existe · contexto seguro: ' + window.isSecureContext +
      '\nSe necesita HTTPS. En http:// solo funciona desde localhost.');
    return;
  }
  try{
    const flujo = await navigator.mediaDevices.getUserMedia({audio:true});
    // 24 kbps alcanza de sobra para voz y recorta el archivo a la mitad.
    grabadora = new MediaRecorder(flujo, {audioBitsPerSecond:24000});
    trozos = [];
    grabadora.ondataavailable = e => trozos.push(e.data);
    grabadora.onstop = enviarVoz;
    grabadora.start();
    escucharVolumen(flujo);
    ponerEstado('ESCUCHANDO…');
  }catch(err){
    fallar('SIN MICRÓFONO · USA EL TECLADO', 'getUserMedia falló: ' + err.name);
    grabadora = null;
  }
}

function parar(){
  if (!grabadora) return;
  grabadora.stop();
  grabadora.stream.getTracks().forEach(t => t.stop());
  dejarDeEscuchar();
  pensando(true);
}

function pensando(si){
  orbe.classList.toggle('pensando', si);
  $('#hablar').disabled = si;
  chips.querySelectorAll('.chip').forEach(c => { c.disabled = si; });
  if (si) ponerEstado('PENSANDO…');
}

async function enviarVoz(){
  const tipo = grabadora.mimeType || 'audio/webm';
  grabadora = null;
  const cuerpo = new FormData();
  cuerpo.append('audio', new Blob(trozos, {type:tipo}), 'turno.' + extension(tipo));
  await mandar('/api/turno', {method:'POST', body:cuerpo});
}

async function enviarTexto(texto){
  if ($('#hablar').disabled) return;
  decir('mio', texto);
  pensando(true);
  await mandar('/api/mensaje', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({texto})
  }, /*yaDicho=*/true);
}

async function mandar(url, opciones, yaDicho){
  try{
    const r = await fetch(url, opciones);
    const d = await r.json();
    if (!r.ok){
      fallar('NO TE ENTENDÍ · INTENTA DE NUEVO',
        (d.error || r.status) + ' · ' + (d.detalle || ''));
      return;
    }
    if (!yaDicho) decir('mio', d.transcripcion);
    decir('coach', d.respuesta);
    if (d.herramientas?.length) anotar('herramientas: ' + d.herramientas.join(', '));
    if (d.plan_version) anotar('plan v' + d.plan_version);
    if (d.motivo_cambio) anotar('motivo: ' + d.motivo_cambio);
    anotar(`respuesta ${d.latencia_ms.total} ms · voz→texto ${d.latencia_ms.transcripcion} · coach ${d.latencia_ms.coach}`);
    ponerEstado('LISTO');
    cargarPlan();
    if (d.turno_id) reproducir(d.turno_id);
  }catch(err){
    fallar('SE CORTÓ LA CONEXIÓN', 'fetch falló: ' + err.message);
  }finally{
    pensando(false);
  }
}

async function reproducir(id){
  const t0 = performance.now();
  try{
    // fetch en vez de dejarle la descarga al <audio>: los móviles frenan la
    // precarga de medios y eso son segundos de espera.
    const r = await fetch('/api/voz/' + id);
    if (!r.ok) return;
    reproductor.src = URL.createObjectURL(await r.blob());
    reproductor.onended = () => ponerEstado('LISTO');
    await reproductor.play();
    ponerEstado('HABLANDO…');
    anotar(`voz suena a los ${Math.round(performance.now()-t0)} ms`);
  }catch(err){ anotar('no se pudo reproducir: ' + err.message); }
}

const btn = $('#hablar');
btn.addEventListener('mousedown', empezar);
btn.addEventListener('mouseup', parar);
btn.addEventListener('touchstart', e => {e.preventDefault(); empezar();});
btn.addEventListener('touchend', e => {e.preventDefault(); parar();});

const DIAS = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const NOMBRE = {facil:'Fácil', calidad:'Calidad', largo:'Largo'};
// Construir la fecha desde el ISO evita el corrimiento de un día por zona horaria.
const fechaLocal = (iso) => { const [a,m,d] = iso.split('-').map(Number); return new Date(a,m-1,d); };

async function cargarPlan(){
  let d;
  try{ d = await (await fetch('/api/plan')).json(); }catch{ return; }

  if (!d.hay_plan){
    const vacio = `<p class="suave" style="margin-top:18px">Todavía no tienes plan.
      Cuéntale al coach qué carrera quieres correr y te lo arma.</p>`;
    $('#cuerpo-plan').innerHTML = vacio;
    $('#cuerpo-agenda').innerHTML = vacio;
    return;
  }

  pintarChips(CON_PLAN);
  $('#cinta').textContent = `SEMANA ${d.semana_actual} DE ${d.semanas_totales}`;
  $('#cinta-plan').textContent =
    `${(d.objetivo || '').toUpperCase()}${d.fecha_carrera ? ' · ' + d.fecha_carrera : ''}`;
  const tag = $('#tag-version');
  tag.hidden = d.version < 2;
  tag.textContent = 'v' + d.version;

  const semana = d.semanas.find(s => s.numero === d.semana_actual) || d.semanas[0];
  const pct = Math.round(d.semana_actual / d.semanas_totales * 100);

  $('#cuerpo-plan').innerHTML = `
    <div class="progreso">
      <span class="eyebrow">SEMANA ${String(d.semana_actual).padStart(2,'0')} / ${d.semanas_totales}</span>
      <span class="riel"><span style="width:${pct}%"></span></span>
    </div>
    ${d.motivo_cambio ? `<p class="suave" style="margin-bottom:16px">${d.motivo_cambio}</p>` : ''}
    ${semana.sesiones.map(s => tarjeta(s, d.hoy)).join('')}
    <div style="height:14px"></div>`;

  $('#cuerpo-agenda').innerHTML = d.dias_para_carrera == null ? '' : `
    <div class="tarjeta hoy" style="flex-direction:column;align-items:flex-start;gap:5px;padding:26px 22px;margin-top:18px">
      <span class="cuenta">${d.dias_para_carrera}</span>
      <span class="eyebrow">DÍAS</span>
      <p class="titulo" style="margin-top:10px">${(d.objetivo || '').toUpperCase()}</p>
      <span class="mono" style="font-size:13px;color:var(--texto-2)">${d.fecha_carrera}</span>
    </div>`;
}

function tarjeta(s, hoy){
  const f = fechaLocal(s.fecha);
  return `<div class="tarjeta ${s.fecha === hoy ? 'hoy' : ''}">
    <span class="barra ${s.tipo}"></span>
    <span class="cuerpo">
      <span class="dia mono">${DIAS[f.getDay()]} ${String(f.getDate()).padStart(2,'0')}</span>
      <div class="tipo">${NOMBRE[s.tipo] || s.tipo}</div>
      ${s.completada ? `<span class="hecha mono">HECHA${s.sensacion ? ' · ' + s.sensacion.toUpperCase() : ''}</span>` : ''}
    </span>
    <span class="km">${s.km}<span style="font-size:12px;color:var(--texto-3)"> km</span></span>
  </div>`;
}

cargarPlan();
</script>
</body>
</html>
