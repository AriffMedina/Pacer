<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacer</title>
</head>
<body>
  <h1>Pacer</h1>

  <button id="hablar">Mantén presionado para hablar</button>

  <p id="estado">Listo.</p>

  <div id="conversacion"></div>

  <pre id="diagnostico"></pre>

  <script>
    const boton = document.getElementById("hablar");
    const estado = document.getElementById("estado");
    const diagnostico = document.getElementById("diagnostico");
    const conversacion = document.getElementById("conversacion");

    let grabadora = null;
    let trozos = [];

    function anotar(linea) {
      diagnostico.textContent += linea + "\n";
    }

    // El navegador decide el formato: Safari graba audio/mp4, Chrome audio/webm.
    // Nunca se asume; se lee de la grabadora y se manda tal cual.
    function extension(tipo) {
      if (tipo.includes("mp4")) return "mp4";
      if (tipo.includes("ogg")) return "ogg";
      return "webm";
    }

    async function empezar() {
      if (grabadora) return;

      // navigator.mediaDevices solo existe en contexto seguro: HTTPS o localhost.
      // Aplica a todos los navegadores, no solo a Safari.
      if (!navigator.mediaDevices) {
        estado.textContent = "Este navegador no expone el micrófono aquí.";
        anotar("navigator.mediaDevices no existe.");
        anotar("Contexto seguro: " + window.isSecureContext + " · origen: " + window.location.origin);
        anotar("Se necesita HTTPS. En http:// solo funciona desde localhost.");
        return;
      }

      try {
        const flujo = await navigator.mediaDevices.getUserMedia({ audio: true });
        grabadora = new MediaRecorder(flujo);
        trozos = [];
        grabadora.ondataavailable = (e) => trozos.push(e.data);
        grabadora.onstop = enviar;
        grabadora.start();
        estado.textContent = "Grabando…";
      } catch (error) {
        estado.textContent = "No se pudo abrir el micrófono.";
        anotar("getUserMedia falló: " + error.name + " — " + error.message);
        anotar("¿La página está en HTTPS? Safari lo exige salvo en localhost.");
        grabadora = null;
      }
    }

    function parar() {
      if (!grabadora) return;
      grabadora.stop();
      grabadora.stream.getTracks().forEach((t) => t.stop());
      estado.textContent = "Enviando…";
    }

    async function enviar() {
      const tipo = grabadora.mimeType || "audio/webm";
      grabadora = null;

      const blob = new Blob(trozos, { type: tipo });
      anotar("grabado " + blob.size + " bytes, tipo " + tipo);

      const cuerpo = new FormData();
      cuerpo.append("audio", blob, "turno." + extension(tipo));

      try {
        const respuesta = await fetch("/api/turno", { method: "POST", body: cuerpo });
        const datos = await respuesta.json();

        if (!respuesta.ok) {
          estado.textContent = "Error: " + (datos.error || respuesta.status);
          anotar(datos.detalle || JSON.stringify(datos));
          return;
        }

        decir("Tú", datos.transcripcion);
        decir("Coach", datos.respuesta);

        if (datos.herramientas.length) {
          anotar("herramientas: " + datos.herramientas.join(", "));
        }
        if (datos.plan_version) {
          anotar("plan v" + datos.plan_version);
        }
        if (datos.motivo_cambio) {
          anotar("motivo: " + datos.motivo_cambio);
        }
        const l = datos.latencia_ms;
        anotar(`respuesta en ${l.total} ms · voz→texto ${l.transcripcion} · coach ${l.coach}`);

        // El texto ya está en pantalla; la voz llega después y no lo bloquea.
        estado.textContent = "Listo.";
        if (datos.turno_id) {
          reproducir(datos.turno_id);
        }
      } catch (error) {
        estado.textContent = "Falló el envío.";
        anotar("fetch falló: " + error.message);
      }
    }

    function decir(quien, texto) {
      const linea = document.createElement("p");
      linea.textContent = quien + ": " + texto;
      conversacion.appendChild(linea);
      linea.scrollIntoView();
    }

    async function reproducir(turnoId) {
      const arranque = performance.now();
      const audio = new Audio("/api/voz/" + turnoId);
      audio.addEventListener("playing", () => {
        anotar(`voz sonando ${Math.round(performance.now() - arranque)} ms después`);
      });
      try {
        await audio.play();
      } catch (error) {
        anotar("no se pudo reproducir: " + error.message);
      }
    }

    boton.addEventListener("mousedown", empezar);
    boton.addEventListener("mouseup", parar);
    boton.addEventListener("touchstart", (e) => { e.preventDefault(); empezar(); });
    boton.addEventListener("touchend", (e) => { e.preventDefault(); parar(); });
  </script>
</body>
</html>
